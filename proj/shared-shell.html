  <script>
  (function () {
    var deferredPrompt = null;

    var openBtn   = document.getElementById('openInstallBtn');
    var modal     = document.getElementById('installModal');
    var closeBtn  = document.getElementById('closeInstallBtn');
    var installBtn  = document.getElementById('installBtn');
    var installHint = document.getElementById('installHint');

    var HINT_DEFAULT = 'Install on phone. More devices available.';
    var APP_PAGE = 'app.html';   // where people download the APK when the web app cannot be installed (use 'https://app.kirezicanje.com' if the page is hosted there)

    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);

    // Is the app already running as an installed app?
    function isInstalledApp() {
      var standalone = false;
      try {
        standalone = window.matchMedia('(display-mode: standalone)').matches ||
                     window.matchMedia('(display-mode: fullscreen)').matches ||
                     window.matchMedia('(display-mode: minimal-ui)').matches;
      } catch (e) {}
      return standalone ||
             window.navigator.standalone === true ||
             (document.referrer || '').indexOf('android-app://') === 0 ||
             /; wv\)/i.test(ua);
    }

    function resetBtn() {
      installBtn.disabled = false;
      installBtn.innerText = 'INSTALL';
      installBtn.style.opacity = '1';
    }

    function showHint(text, isTip) {
      installHint.innerText = text;
      installHint.className = isTip ? 'ios-tip' : '';
    }

    // ---- open / close the install screen ----
    function openInstall() {
      if (isInstalledApp()) return;
      resetBtn();
      showHint(HINT_DEFAULT, false);
      if (isIOS) {
        showHint('To install on iPhone/iPad: tap the Share button, then "Add to Home Screen".', true);
      }
      modal.classList.add('open');
      modal.scrollTop = 0;
      document.body.style.overflow = 'hidden';
    }

    function closeInstall() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    function hideEverything() {
      closeInstall();
      openBtn.style.display = 'none';
    }

    // Show the "Install app" button only if the app isn't installed yet
    if (isInstalledApp()) {
      openBtn.style.display = 'none';
    } else {
      openBtn.style.display = 'inline-flex';
    }

    openBtn.addEventListener('click', openInstall);
    closeBtn.addEventListener('click', closeInstall);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeInstall();
    });

    // ---- browser install prompt (Chrome / Edge / Samsung Internet) ----
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();               // keep the event so INSTALL can trigger it later
      deferredPrompt = e;
    });

    window.addEventListener('appinstalled', function () {
      deferredPrompt = null;
      hideEverything();
    });

    // ---- INSTALL button ----
    installBtn.addEventListener('click', function () {

      // 1) Real PWA install (best option)
      if (deferredPrompt) {
        installBtn.disabled = true;
        installBtn.innerText = 'INSTALLING...';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function (choice) {
          deferredPrompt = null;
          if (choice && choice.outcome === 'accepted') {
            if (window.kcRegisterPwa) window.kcRegisterPwa();   // counts the download
            hideEverything();
          } else {
            resetBtn();
          }
        }).catch(function () { location.href = APP_PAGE; });   // the install failed: use the download page
        return;
      }

      // 2) iPhone / iPad: no install API, show instructions
      if (isIOS) {
        showHint('Tap the Share button (square with arrow), then choose "Add to Home Screen".', true);
        return;
      }

      // 3) the browser cannot install the web app: go to the download page (APK + reviews)
      installBtn.disabled = true;
      installBtn.innerText = 'OPENING…';
      location.href = APP_PAGE;
      return;
    });
  })();
  </script>
  <script type="module">
    // numbers + reviews + comments inside the install screen
    import { loadStats, fillStats, mountReviews, registerDownload, who } from './appstore.js';
    var mounted = false;
    function openStore() {
      loadStats().then(fillStats).catch(function () {});
      if (!mounted) { mounted = true; mountReviews(document.getElementById('storeReviews')); }
    }
    var ob = document.getElementById('openInstallBtn');
    if (ob) ob.addEventListener('click', openStore);
    window.kcRegisterPwa = function () { var w = who(); return registerDownload('pwa', w.name, w.phone); };
  </script>
